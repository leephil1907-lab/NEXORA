services:
  - type: web
    name: nexora
    runtime: node
    region: ohio
    plan: pro
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OMEGA_API_KEY
        sync: false
      - key: VENICE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: NEXORA_IMAGE_CREDIT_COST
        value: "1"
      - key: NEXORA_VIDEO_CREDIT_COST
        value: "10"
      - key: NEXORA_MAX_UPLOAD_MB
        value: "20"
      - key: NEXORA_ALLOW_SENSITIVE
        value: "false"
